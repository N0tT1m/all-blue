[project]
name = "all-blue"
version = "0.1.0"
description = "An anime library you can talk to."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psycopg[binary]",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/all_blue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
